name: Test Ultra reporter

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - name: Setup Node v22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint check
        run: pnpm lint

      - name: Format check
        run: pnpm format

  build:
    runs-on: ubuntu-latest
    needs: lint
    environment: Preview
    env:
      NEXT_PUBLIC_DEVCYCLE_SERVER_SDK_KEY: ${{ secrets.NEXT_PUBLIC_DEVCYCLE_SERVER_SDK_KEY }}
      NEXT_PUBLIC_DEVCYCLE_CLIENT_SDK_KEY: ${{ secrets.NEXT_PUBLIC_DEVCYCLE_CLIENT_SDK_KEY }}
      NEXT_PUBLIC_FLAGSMITH_ENVIRONMENT_ID: ${{ secrets.NEXT_PUBLIC_FLAGSMITH_ENVIRONMENT_ID }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - name: Setup Node v22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build the Project
        if: env.NEXT_PUBLIC_DEVCYCLE_CLIENT_SDK_KEY
        run: pnpm build
